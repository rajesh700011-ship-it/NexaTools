<style>
:root{--bg:#F1F7FD;--card:#fff;--tx:#0F2742;--sub:#6B7C93;--nav:#0B3A5B;--pri:#1A6CF0;--bd:#DCE8F5;--soft:#EAF3FF}
:root[data-t=dark]{--bg:#0C1A2B;--card:#13263C;--tx:#EAF2FB;--sub:#8FA3BA;--bd:#223card;--bd:#22384F;--soft:#16304B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
main{padding:16px 16px 8px;max-width:520px;margin:auto}
h1{font-size:26px;margin:0}h2{font-size:20px;margin:0}p{margin:2px 0;color:var(--sub);font-size:13px}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;color:#fff;flex:none}
.logo{width:64px;height:64px;border-radius:0;background:none!important;display:block}.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(30,120,245,.35))}
.pill{display:flex;align-items:center;gap:10px;background:#DCEBFF;color:var(--tx);padding:13px 14px;border-radius:14px;font-weight:600;font-size:14px;margin-bottom:14px;cursor:pointer}
:root[data-t=dark] .pill{background:#16304B}
.pill span:last-child{margin-left:auto;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:16px;color:#fff;min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tile .ic{background:rgba(255,255,255,.25);width:44px;height:44px;font-size:22px;border-radius:12px}
.tile b{font-size:17px;margin-top:6px}.tile small{opacity:.9;font-size:12px}
.blue{background:linear-gradient(135deg,#1E78F5,#3B8CFF)}.purple{background:linear-gradient(135deg,#7A4DF0,#9A6BFF)}
.green{background:linear-gradient(135deg,#1FB57E,#35C98F)}.orange{background:linear-gradient(135deg,#F59A26,#FF8A3D)}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--bd);margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;border:1px solid var(--bd);margin-bottom:8px;cursor:pointer}
